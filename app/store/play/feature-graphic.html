<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature graphic — Google Play</title>
<!-- The Play listing's feature graphic, 1024 x 500: the share card's design
     (site/share.html) at the store's shape, the brain mark at its centre
     since v12.23 where the ring stood. Rendered to feature-graphic.jpg beside
     this file by a Playwright shot of #card at 1024 x 500 (the shoot-play.js
     that once did it is not in the repository); open it in a browser to see
     it, and re-render when the card changes. -->
<link rel="stylesheet" href="../../../site/fonts/fonts.css">
<style>
@font-face{ font-family:'Flux'; src:url('../../../site/fonts/Flux-Regular.woff2') format('woff2'); font-weight:400 700; font-display:block; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:#0A0705; }
.card{ position:relative; width:1024px; height:500px; background:#0A0705; overflow:hidden; --band:282px; }
.scans img{ position:absolute; top:var(--band); transform:translateY(-50%); height:236px; width:auto; display:block; filter:contrast(1.06); }
.scans .sag{ left:46px; }
.scans .ax{ right:94px; }
.mark{ position:absolute; left:50%; top:var(--band); transform:translate(-50%,-50%); width:244px; height:244px; }
.mark img{ width:100%; height:100%; display:block; object-fit:contain; }
.word{ position:absolute; left:0; right:0; top:30px; text-align:center; font-family:'Flux','Afacad Flux',sans-serif; font-weight:500; font-size:86px; line-height:1; letter-spacing:.01em; color:#FFFFFF; }
.footline{ position:absolute; left:38px; right:38px; bottom:30px; display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; gap:18px; font-family:'Flux','Afacad Flux',sans-serif; font-weight:500; text-transform:uppercase; white-space:nowrap; }
.footline .side{ font-size:13px; letter-spacing:.24em; color:#C98A56; }
.footline .side.quiet{ color:#8A6547; justify-self:end; }
.footline .strap{ font-size:20px; letter-spacing:.3em; color:#FFB26B; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="scans">
    <img class="sag" src="../../../site/assets/social/sagittal.png" alt="" width="256" height="215">
    <img class="ax" src="../../../site/assets/social/axial.png" alt="" width="207" height="256">
  </div>
  <div class="mark"><img src="../../../site/assets/logo.svg" alt="VisualNeuroscience.AI"></div>
  <div class="word">VisualNeuroscience.AI</div>
  <div class="footline">
    <span></span>
    <span class="strap">Mapping the brain in the browser</span>
    <span class="side quiet">MNI152 &middot; AAL-116</span>
  </div>
</div>
</body>
</html>
