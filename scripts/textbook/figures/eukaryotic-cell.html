  <script type="application/json" class="tb-cell-data">{"membrane": {"name": "Plasma membrane", "sub": "The cell&rsquo;s boundary", "desc": "A double layer of phospholipids studded with proteins, separating the inside of the cell from the outside. It decides what passes: ions through channels, signals through receptors. In a neuron it is where the electrical signal runs."}, "cytoplasm": {"name": "Cytoplasm", "sub": "Everything between membrane and nucleus", "desc": "The water, salts and proteins that fill the cell and hold its organelles. Most of the cell&rsquo;s chemistry happens dissolved in it, and translation takes place here, on ribosomes."}, "nucleus": {"name": "Nucleus", "sub": "The cell&rsquo;s library", "desc": "Holds the DNA behind a double membrane pierced by pores. Genes are copied into mRNA here, and the mRNA leaves through the pores to be read outside. The dense spot is the nucleolus."}, "dna": {"name": "DNA (in the nucleus)", "sub": "The genome, coiled", "desc": "About two metres of it in every nucleus, wound around histone proteins into chromatin, the tangle drawn here. Its sequence holds every gene the cell could express; which genes it does express is what makes a neuron a neuron."}, "nucleolus": {"name": "Nucleolus", "sub": "Where ribosomes are made", "desc": "The dense region of the nucleus where ribosomal RNA is transcribed and the two halves of each ribosome are assembled, before they leave for the cytoplasm."}, "envelope": {"name": "Nuclear envelope", "sub": "Two membranes and their pores", "desc": "The double membrane around the nucleus, continuous with the endoplasmic reticulum. Its pores are gates that let mRNA out and finished proteins in, under control."}, "rer": {"name": "Rough endoplasmic reticulum", "sub": "Membrane studded with ribosomes", "desc": "Flattened sacs wrapped around the nucleus, continuous with its envelope; the dots along them are ribosomes. They thread new proteins into the sacs, where they fold and are checked before going on to the Golgi, bound for a membrane or for release, receptors and peptide transmitters among them."}, "ser": {"name": "Smooth endoplasmic reticulum", "sub": "Membrane without ribosomes", "desc": "Tubes of membrane that make lipids, store calcium and break down drugs and toxins. In a neuron its calcium stores reach into the dendrites and help shape their signals."}, "ribosomes": {"name": "Ribosomes", "sub": "The protein factories", "desc": "Two-part machines of RNA and protein that read an mRNA three bases at a time and join the amino acids it names into a chain. Free in the cytoplasm they make the cell&rsquo;s own proteins; on the rough ER, the ones bound for membranes or export."}, "mito": {"name": "Mitochondrion", "sub": "The cell&rsquo;s power plant", "desc": "Two membranes, the inner one folded into cristae, where sugar and fat are burned with oxygen to make ATP, the cell&rsquo;s energy currency. It keeps a small genome of its own, a relic of the bacterium it once was. Neurons are hungry for ATP and ship mitochondria far out along their axons."}, "lysosome": {"name": "Lysosome", "sub": "The recycling centre", "desc": "A membrane bag of acid and digestive enzymes that breaks down worn-out organelles, misfolded proteins and whatever the cell takes in, and hands the parts back for reuse."}, "golgi": {"name": "Golgi apparatus", "sub": "The sorting office", "desc": "A stack of flattened sacs that receives proteins from the ER, finishes them, adds sugars, sorts them and packs them into vesicles addressed to the membrane, to the outside or to lysosomes."}, "vesicles": {"name": "Vesicles", "sub": "Membrane bubbles on the move", "desc": "Small packets of membrane that carry cargo between the ER, the Golgi, the plasma membrane and beyond. A synaptic vesicle is one of these, filled with neurotransmitter and waiting at the terminal."}}</script>
