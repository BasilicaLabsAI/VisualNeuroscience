<style>
/* the brand face, served as a file */
@font-face{
  font-family:'Flux';
  src:url('fonts/Flux-Regular.woff2') format('woff2');
  font-weight:400 700; font-display:swap;
}

:root{
  --paper:#FFFFFF;
  --ink:#111111;
  --ink-60:#5A5A5A;
  --ink-35:#A9A9A9;
  --hair:#111111;

  --font-brand:'Flux','Afacad Flux',sans-serif;
  --font-serif:'Newsreader',Georgia,serif;
  --font-display:'Prata',Georgia,serif;

  --wrap:1880px;
  --gap:14px;
}

/* dark mode — exact inverse of the default palette, site-wide */
:root[data-theme="dark"]{
  --paper:#111111;
  --ink:#FFFFFF;
  --ink-60:#A9A9A9;
  --ink-35:#5A5A5A;
  --hair:#FFFFFF;
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-serif); font-size:1rem; line-height:1.62;
  font-optical-sizing:auto; -webkit-font-smoothing:antialiased;
  padding-bottom:2rem;
}
::selection{ background:var(--ink); color:var(--paper); }
a{ color:var(--ink); text-decoration:none; }
@media (hover: hover){ a:hover{ text-decoration:underline; text-underline-offset:3px; } }
:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
svg{ display:block; }

.wrap{ max-width:var(--wrap); margin:0 auto;
  padding-left:clamp(14px,2.5vw,48px); padding-right:clamp(14px,2.5vw,48px); }

/* ── masthead ── */
.masthead{ text-align:center; padding:clamp(26px,4vw,44px) 0 0; }
.masthead .brand{ font-size:clamp(1.55rem,4.6vw,2.8rem); }
.brand{
  display:inline-flex; align-items:baseline; gap:.36em;
  font-family:var(--font-brand); font-weight:500;
  line-height:1; letter-spacing:.01em; color:var(--ink);
}
@media (hover: hover){ .brand:hover{ text-decoration:none; } }
/* the mark sits to the left of the wordmark. Flex baseline alignment
   puts an image's bottom edge on the text baseline, so a box one cap
   height tall lands squarely between baseline and cap line. The brand
   face measures .647em to the cap line. */
.brand .mark{ width:1em; height:1em; flex:none; }
.nav-row{
  display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
  gap:.3rem clamp(1rem,2.6vw,2rem);
  padding:clamp(16px,2.6vw,26px) 0 clamp(14px,2.2vw,20px);
}
.nav-row a{
  font-family:var(--font-brand); font-weight:500; font-size:.74rem;
  letter-spacing:.3em; text-transform:uppercase;
}
.nav-row a[aria-current]{ border-bottom:2px solid var(--ink); padding-bottom:2px; }
.theme-toggle{
  font-family:var(--font-brand); font-weight:500; font-size:.66rem;
  letter-spacing:.22em; text-transform:uppercase; color:var(--ink);
  background:none; border:1px solid var(--hair); cursor:pointer;
  padding:.28rem .6rem; display:inline-flex; align-items:center; gap:.42rem;
}
@media (hover: hover){ .theme-toggle:hover{ background:var(--ink); color:var(--paper); } }
.theme-toggle .th-dot{
  width:.66rem; height:.66rem; border:1px solid currentColor; border-radius:50%;
  background:linear-gradient(90deg, currentColor 0 50%, transparent 50% 100%);
}

/* ── the screen ──────────────────────────────────────────────────────────
   The receptor viewer is a page of its own (assets/molecular/receptors.html)
   that lays itself out against its window: its bar along the foot, its
   receptor box and its window of text. Here it is given everything under
   the header, as the 3D Region Atlas gives its views, and nothing scrolls:
   the page's root is held still with its body, and the folded site menu,
   taller than a phone held sideways, scrolls within the room under the
   header. --screen-top is the header's measured height; the apps' pages
   have no header and start at nought. */
body.atlas-screen{ overflow:hidden; margin:0; padding-bottom:0; }
html:has(> body.atlas-screen){ overflow:hidden; }
:root[data-shell][data-shell-pad] body.atlas-screen{ padding-top:max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)); }
main.screen{
  max-width:none; padding:0; margin:0;
  height:calc(100vh - var(--screen-top, 0px)); height:calc(100dvh - var(--screen-top, 0px));
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
  background:#0F222B;   /* the viewer's own dark and light grounds, until it paints */
}
:root:not([data-theme="dark"]) main.screen{ background:#DCE9EC; }
main.screen iframe{ flex:1 1 auto; min-height:0; width:100%; border:0; display:block; }
.screen .vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
</style>

<body class="atlas-screen">

<main id="main" class="screen" aria-label="Molecular">
  <h1 class="vh">Molecular</h1>
  <iframe id="viewer" data-src="assets/molecular/receptors.html" title="Receptors in 3D" allow="fullscreen"></iframe>
  <script>/* The viewer needs scripting anyway, so its address is set from
     here rather than in the markup: this page's own query and hash go
     straight through, molecular.html?receptor=5-HT2A&tab=drugs&drug=LSD or
     the short form molecular.html#5-HT2A/drugs/LSD, and the frame loads
     once rather than starting on the plain address and being turned. */
  (function(){ var f = document.getElementById("viewer"); f.src = f.getAttribute("data-src") + location.search + location.hash; })();</script>
</main>
<script src="assets/native.js"></script>
<script src="assets/navbar.js"></script>
<script src="assets/newsletter.js" defer></script>
<script>
(function(){
  "use strict";
  var root = document.documentElement;
  var frame = document.getElementById("viewer");

  /* ── theme, shared with the rest of the site, and passed into the viewer ── */
  var themeBtn = document.getElementById("themeBtn");
  var themeLbl = document.getElementById("themeLbl");
  function syncTheme(){
    var dark = root.getAttribute("data-theme") === "dark";
    try { frame.contentDocument.documentElement.setAttribute("data-theme", dark ? "dark" : "light"); } catch (e){}
  }
  if (root.getAttribute("data-theme") === "dark"){
    themeLbl.textContent = "Light";
    themeBtn.setAttribute("aria-pressed", "true");
  }
  themeBtn.addEventListener("click", function(){
    var dark = root.getAttribute("data-theme") === "dark";
    if (dark){ root.removeAttribute("data-theme"); themeLbl.textContent = "Dark"; }
    else { root.setAttribute("data-theme", "dark"); themeLbl.textContent = "Light"; }
    themeBtn.setAttribute("aria-pressed", String(!dark));
    try{ localStorage.setItem("mn-theme", dark ? "light" : "dark"); }catch(e){}
    syncTheme();
  });
  frame.addEventListener("load", syncTheme);

  /* ── deep links ──
     The frame was given this page's query and hash as it was parsed. As the
     reader moves about, the viewer reports where it is and this page keeps
     the short form in its own address, so the link in the bar can be copied
     and comes back to the same receptor, tab and drug. */
  window.addEventListener("message", function(e){
    var d = e.data;
    if (!d || d.type !== "receptor-viewer" || e.source !== frame.contentWindow) return;
    if (!d.receptor) return;
    var h = "#" + d.receptor + "/" + (d.tab || "binding") + (d.drug ? "/" + encodeURIComponent(d.drug) : "");
    if (location.hash !== h){ try { history.replaceState(history.state, "", location.pathname + h); } catch (err){} }
  });

  /* ── the screen takes everything under the header: its height is measured
     into --screen-top, again whenever the header or the window changes ── */
  var main = document.getElementById("main"), head = document.querySelector(".masthead");
  function fit(){
    var top = main.getBoundingClientRect().top + (window.pageYOffset || 0);
    root.style.setProperty("--screen-top", Math.max(0, Math.round(top)) + "px");
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  if (window.ResizeObserver){ var ro = new ResizeObserver(fit); if (head) ro.observe(head); ro.observe(document.body); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>

<script type="module" src="assets/auth-ui.js"></script>
